<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1320">
  <title>Kingfisher — {{.Aircraft}}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header id="hdr">
    <div class="brand"><img class="brand-icon" src="/static/favicon.svg" width="22" height="22" alt=""> Kingfisher</div>
    <div id="clockStatus" class="clockStatus" hidden></div>
    <div id="podStatus" class="podStatus" hidden></div>
    <div class="tail">{{.Aircraft}}</div>
    <button id="pauseBtn" class="pauseBtn" title="Pause recording">⏸</button>
    <div class="rec"><span id="recDot">●</span> <span id="recLabel">REC</span> <span id="dbSize">—</span></div>
  </header>

  <nav id="tabBar" aria-label="Sensor tabs">
    <label class="tabGroupFilter" for="tabGroupFilter">
      <span class="tabGroupFilterLbl">Group</span>
      <select id="tabGroupFilter" title="Filter sensor tabs by location">
        <option value="all" selected>All</option>
        <option value="hub">Hub</option>
        <option value="pod">Pod</option>
        <option value="calc">Calc</option>
      </select>
    </label>
    <div id="tabs" role="tablist"></div>
  </nav>
  <main id="panel"></main>

  <footer id="ftr">
    <div id="bufStat">Buffered: — rows</div>
    <div class="ftrActions">
      <button type="button" id="terminalBtn">Terminal</button>
      <button id="settingsBtn">Settings</button>
    </div>
  </footer>

  <dialog id="settingsDlg">
    <form method="dialog">
      <h2>Settings</h2>
      <label>Aircraft <input id="cfgAircraft" /></label>
      <label>Notes <textarea id="cfgNotes" rows="3"></textarea></label>
      <label>Flush seconds <input id="cfgFlush" type="number" min="1" max="60" /></label>
      <div class="dlgRow">
        <button id="cfgSave" value="save">Save</button>
        <button value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <script>window.KF_INITIAL_DEVICES = {{.Devices}};</script>
  <script src="/static/display.js"></script>
  <script src="/static/compass.js"></script>
  <script src="/static/airspeed.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
