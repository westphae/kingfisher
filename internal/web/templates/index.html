<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1320">
  <title>Kingfisher — {{.Aircraft}}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header id="hdr">
    <div class="brand">Kingfisher</div>
    <div class="tail">{{.Aircraft}}</div>
    <span id="podTag" class="podTag pod-off" title="Pod ingest not running">POD</span>
    <button id="pauseBtn" class="pauseBtn" title="Pause recording">⏸</button>
    <div class="rec"><span id="recDot">●</span> <span id="recLabel">REC</span> <span id="dbSize">—</span></div>
  </header>

  <nav id="tabs"></nav>
  <main id="panel"></main>

  <footer id="ftr">
    <div id="bufStat">Buffered: — rows</div>
    <button id="settingsBtn">Settings</button>
  </footer>

  <dialog id="settingsDlg">
    <form method="dialog">
      <h2>Settings</h2>
      <label>Aircraft <input id="cfgAircraft" /></label>
      <label>Notes <textarea id="cfgNotes" rows="3"></textarea></label>
      <label>Flush seconds <input id="cfgFlush" type="number" min="1" max="60" /></label>
      <fieldset id="cfgDevices">
        <legend>Sensors (Hz)</legend>
      </fieldset>
      <div class="dlgRow">
        <button id="cfgSave" value="save">Save</button>
        <button value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <script>window.KF_INITIAL_DEVICES = {{.Devices}};</script>
  <script src="/static/app.js"></script>
</body>
</html>
